name = "skill-flix-telegram-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
workers_dev = true

[vars]
FIREBASE_PROJECT_ID = "skillflix-academy"
ALLOWED_ORIGINS = "https://skillflix-academy.web.app,https://skillflix-academy.firebaseapp.com,http://localhost:3000,http://127.0.0.1:3000"

# Configure encrypted secrets via CLI (never commit secrets here):
#   npx wrangler secret put TELEGRAM_ENCRYPTION_KEY
#   npx wrangler secret put FIREBASE_CLIENT_EMAIL
#   npx wrangler secret put FIREBASE_PRIVATE_KEY
#
# Optional default fallback bot stored strictly in Cloudflare Worker Secrets:
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_CHAT_ID
