name: Deploy Skill-Flix

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skillflix-deployment
  cancel-in-progress: false

jobs:
  firebase:
    name: Build and Deploy Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Create Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SKILLFLIX_ACADEMY }}
        run: |
          node -e '
          const fs = require("fs");
          const credentials = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          if (
            credentials.project_id !== "skillflix-academy" ||
            !credentials.client_email ||
            !credentials.private_key
          ) {
            throw new Error("Invalid Firebase service account credentials");
          }
          fs.writeFileSync(
            "/tmp/firebase-sa.json",
            JSON.stringify(credentials),
            { mode: 0o600 }
          );
          console.log("Firebase credentials validated.");
          '

      - name: Deploy Hosting and Firestore Rules
        run: npx --yes firebase-tools deploy --only hosting,firestore:rules --project skillflix-academy --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json

  cloudflare:
    name: Deploy Telegram Worker
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cloudflare-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Check
        run: npm run typecheck

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure Worker Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_ENCRYPTION_KEY: ${{ secrets.TELEGRAM_ENCRYPTION_KEY }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: |
          printf '%s' "$TELEGRAM_ENCRYPTION_KEY" | npx wrangler secret put TELEGRAM_ENCRYPTION_KEY
          printf '%s' "$FIREBASE_CLIENT_EMAIL" | npx wrangler secret put FIREBASE_CLIENT_EMAIL
          printf '%s' "$FIREBASE_PRIVATE_KEY" | npx wrangler secret put FIREBASE_PRIVATE_KEY
